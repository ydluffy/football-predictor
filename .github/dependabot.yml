version: 2
updates:
  - package-ecosystem: pip
    directory: /football-predictor
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
