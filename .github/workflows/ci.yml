name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football-predictor
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: football-predictor/requirements.txt

      - name: Install project
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --no-deps -e .

      - name: Validate dependency lock
        run: python scripts/check_dependency_lock.py

      - name: Scan tracked files for secrets
        run: python scripts/check_secrets.py

      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt --no-deps --disable-pip --progress-spinner off

      - name: Lint Python
        run: python -m ruff check src/api/observability.py src/api/routes src/api/services src/quality scripts/check_data_model_quality.py scripts/check_dependency_lock.py scripts/check_secrets.py tests/test_chat_routes.py tests/test_chat_http_integration.py tests/test_data_model_quality_gate.py tests/test_observability.py tests/test_operations_routes.py tests/test_research_copilot_service.py

      - name: Type-check Python
        run: python -m mypy --explicit-package-bases src/api/observability.py src/api/services/chat_client.py src/api/routes/operations.py src/quality/data_model_gate.py scripts/check_data_model_quality.py scripts/check_dependency_lock.py scripts/check_secrets.py

      - name: Validate data and model quality policy
        run: python scripts/check_data_model_quality.py --dataset tests/fixtures/data_model_quality/current.csv --reference tests/fixtures/data_model_quality/reference.csv --metrics tests/fixtures/data_model_quality/metrics.json --as-of 2026-08-27T00:00:00Z --output _tmp/ci-data-model-quality.json

      - name: Run tests
        run: python -m pytest -q --basetemp _tmp/ci-pytest

  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Test audit retry policy
        run: node --test ../scripts/npm-audit.test.mjs

      - name: Audit npm dependencies
        run: node ../scripts/npm-audit.mjs

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
