[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictor"
version = "0.1.0"
description = "Football match prediction project scaffold"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn==1.8.0",
  "lightgbm",
  "fastapi",
  "uvicorn",
  "requests",
  "beautifulsoup4",
  "pydantic",
  "loguru",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5,<2",
  "httpx2>=2.12,<3",
  "mypy>=1.15,<3",
  "pip-audit>=2.9,<3",
  "pip-tools>=7.5,<8",
  "pytest>=8.0",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "BLE", "C90", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/api/routes/chat.py" = ["C901"]
"src/api/routes/p0.py" = ["BLE001"]
"src/api/routes/sporttery.py" = ["BLE001"]
"src/api/services/research_copilot.py" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning",
  "error::FutureWarning",
  "error:Could not infer format.*:UserWarning",
]
