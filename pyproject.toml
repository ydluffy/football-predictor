[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictor"
version = "0.1.0"
description = "Local football match prediction system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "loguru>=0.7",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "scikit-learn>=1.4",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
